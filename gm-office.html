function bfs(sx, sy, tx, ty, avoid) {   // avoid: optional Set of cell indexes to route around (people in the way)

  const start = idx(sx, sy), goal = idx(tx, ty), prev = new Int16Array(GX * GY).fill(-1), q = [start];
  prev[start] = start;
  for (let qi = 0; qi < q.length; qi++) {
    const c = q[qi];
    if (c === goal) break;
    const cx = c % GX, cy = (c / GX) | 0;
    for (const [dx, dy] of [[0, 1], [0, -1], [1, 0], [-1, 0]]) {
      const nx = cx + dx, ny = cy + dy;
      if (nx < 0 || ny < 0 || nx >= GX || ny >= GY) continue;
      const n = idx(nx, ny);
      if (prev[n] !== -1 || ((blocked[n] || isSeat[n] || (avoid && avoid.has(n))) && n !== goal)) continue;
      prev[n] = c; q.push(n);

  if (prev[goal] === -1) return null;
  const path = [];
  for (let c = goal; c !== start; c = prev[c]) path.push([c % GX, (c / GX) | 0]);

}
