'use strict';
/*
  GM Office idle screen (office TV).
  Top-down pixel art of the real office floor plan (old-school Zelda / Pokemon Blue view): the glass offices
  along the windows, the five desk banks, the closet + washroom block, the kitchen (sink counter, coffee machine,
  fridge, island), the lunch table and the entrance corridor off the building hallway. The team types, takes
  headset calls (sometimes pacing), chats, grabs coffee, holds meetings in the glass meeting room and eats lunch
  at the big table. The white and brown toy poodles drop in now and then.

  Responsive: the scene integer-scales to whatever screen it is on; neighbouring units (greyed out), the hallway
  and the cement alley above fill the rest. Self-contained single file; the only network call is the weather.
  Clock and daylight follow Eastern time (America/Toronto) no matter where the screen is.
  The top windows and the alley show the live weather: sun, cloud, rain or snow.

  URL params:
    (headcount follows the weekday in Eastern time: Tue/Thu 80-95% of the 31 desks, Mon/Wed/Fri 10-30%, weekends empty)
    ?day=tue        preview another weekday              ?people=20  force today's headcount
    ?weather=rain   force sun | cloud | rain | snow     (default: live weather from the feed, Montreal)
    ?time=14:30     start the clock at that time and let it run (also 2:30pm, 14)
    ?hour=14        freeze the clock (decimal ok)        ?speed=60  run the clock N times faster
    ?tz=America/Chicago   clock time zone (weather city is set in the Apps Script: WEATHER_CITY)
    ?scale=4        force the pixel scale                ?lofi=0    no warm tint / vignette
    ?seed=N         seed the randomness                  ?dogs=1    bring the poodles in right away (9:00-16:30)
    ?chat=0         no speech bubbles at all              ?feed=0    don't read the live activity feed

*/

const TZ = params.get('tz') || 'America/Toronto';
const LOFI = params.get('lofi') !== '0';
const FPS = 30;
const C8 = 8, GX = 48, GY = 28;          // 8px grid cells; x 0-5 is the entrance corridor, x 6-47 the office
const WALK = 30;                          // px per second
const OUT = '#1a1c3a';

let seed = params.has('seed') ? (parseInt(params.get('seed')) | 0) : (Math.random() * 1e9) | 0;

const DAY_PARAM = WEEKDAYS.includes((params.get('day') || '').toLowerCase().slice(0, 3)) ? params.get('day').toLowerCase().slice(0, 3) : null;
function zoneDay() {   // weekday + date key in the office's time zone (?day=tue previews another weekday)
  const o = {}; for (const p of dayFmt.formatToParts(new Date())) o[p.type] = p.value;
  return { wd: DAY_PARAM || o.weekday.toLowerCase().slice(0, 3), key: `${o.year}-${o.month}-${o.day}${DAY_PARAM ? '-' + DAY_PARAM : ''}` };

const paramTime = (() => {

// Montreal / Toronto sunrise and sunset by month (local clock time)
const SUNRISE = [7.6, 7.2, 6.9, 6.4, 5.6, 5.1, 5.3, 5.9, 6.6, 7.3, 6.9, 7.5];

  '............', '...hhhhhh...', '..hhhhhhhh..', '.hhhhhhhhhh.', '.hhsshhsshh.', '.hssssssssh.', '.hsessssesh.', '..ssssssss..',
  '...ssSSss...', '..ttttTttt..', '.tttttttttt.', '.sttTttTtts.', '.s.tttttt.s.', '...pppppp...', '...pp..pp...', '...pp..pp...', '...kk..kk...',

  '....ssSss...', '...tttttt...', '...ttttttss.', '...ttttTt...', '...pppppppp.', '...pppppppp.', '.........pp.', '.........kkk',

// ---------------------------------------------------------------- lighting
let lights = [];
const lc = { c: null, x: null };
function lighting() {
  const day = daylight(world.hour), occupied = workers.some(w => w.present);
  const gloom = weather === 'sun' ? 0 : weather === 'cloud' ? 0.08 : 0.14;
  const outDark = Math.min(0.85, 0.72 * (1 - day) + gloom * day);
  const inDark = occupied ? 0 : Math.min(0.85, 0.06 + 0.72 * (1 - day));   // office lights follow occupancy
  if (outDark < 0.01 && inDark < 0.01) return;
  const L = lc.x;
  L.globalCompositeOperation = 'source-over'; L.setTransform(1, 0, 0, 1, 0, 0);
  L.clearRect(0, 0, VW, VH);
  L.fillStyle = `rgba(10,12,40,${outDark})`; L.fillRect(0, 0, VW, VH);
  const indoor = [[OX + 45, OY - 22, GX * C8 - 42, GY * C8 + 26], [0, OY + 24 * C8 - 11, OX + 48, 4 * C8 + 15]];   // our office + the hallway
  for (const r of indoor) L.clearRect(...r);
  L.fillStyle = `rgba(10,12,40,${inDark})`;
  for (const r of indoor) L.fillRect(...r);
  L.globalCompositeOperation = 'destination-out';
  L.translate(OX, OY);
  for (const l of lights) {
    const gr = L.createRadialGradient(l.x, l.y, 0, l.x, l.y, l.r);
    gr.addColorStop(0, `rgba(0,0,0,${l.a})`); gr.addColorStop(1, 'rgba(0,0,0,0)');
    L.fillStyle = gr; L.fillRect(l.x - l.r, l.y - l.r, l.r * 2, l.r * 2);
  }
  g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.drawImage(lc.c, 0, 0); g.restore();
  if (Math.max(outDark, inDark) > 0.25) {
    g.globalCompositeOperation = 'lighter';
    for (const l of lights) if (l.c) {
      const [r, gg, b] = hex(l.c), gr = g.createRadialGradient(l.x, l.y, 0, l.x, l.y, l.r * 0.8);
      gr.addColorStop(0, `rgba(${r},${gg},${b},0.14)`); gr.addColorStop(1, `rgba(${r},${gg},${b},0)`);
      g.fillStyle = gr; g.fillRect(l.x - l.r, l.y - l.r, l.r * 2, l.r * 2);
    }
    g.globalCompositeOperation = 'source-over';
  }
}

  let text = pick(lines.length ? lines : GREETINGS[kind]);
  if (w.role === 'am') text = text.toUpperCase();                 // account managers are loud
  w.bubble = null;
  speech = { w, text, t: 0, life: 3 + text.length * 0.06, greet: true };
}
function speechFor_(uid) {
  if (!feed) return [];
  const e = feed.feed.find(x => String(x.user_id) === String(uid));
  return e && Array.isArray(e.speech) ? e.speech.filter(Boolean) : [];
}
// Who speaks: someone in the office with their own lines (it's their turn at a shared seat), or anyone for "all" lines.
function sayRandom() {
  if (!feed) return false;
  const here = workers.filter(w => w.present && !w.hidden && w.px >= 0);
  const pools = [];
  const mine = here.filter(w => w.v.uid).map(w => [w, speechFor_(w.v.uid)]).filter(p => p[1].length);
  if (mine.length) pools.push([() => { const [w, lines] = pick(mine); return [w, pick(lines)]; }, 3]);
  const all = speechFor_('all'), talkers = here.filter(w => w.talk > 0 && w.role !== 'product');   // interns + HR never talk; product only says their own lines
  if (all.length && talkers.length) pools.push([() => [weighted(talkers.map(c => [c, c.talk])), pick(all)], 2]);
  if (!pools.length) return false;
  let w, text;
  for (let k = 0; k < 4; k++) { [w, text] = weighted(pools)(); if (text !== lastText) break; }
  lastText = text;
  w.bubble = null;
  if (w.role === 'am') text = text.toUpperCase();   // account managers are loud: ALL CAPS
  speech = { w, text, t: 0, life: 4 + text.length * 0.07 };
  return true;
}
function updateSpeech(dt) {
  if (speech) { speech.t += dt; if (speech.t >= speech.life || !speech.w.present || speech.w.hidden) speech = null; return; }
  if (CHAT && (chatT -= dt) <= 0) chatT = sayRandom() ? rnd(60, 150) : rnd(5, 10);   // about one line every 1-2.5 min
}
function wrapText(c, text, maxW) {
  const lines = []; let cur = '';
  for (const word of text.split(' ')) { const t = cur ? cur + ' ' + word : word; if (cur && c.measureText(t).width > maxW) { lines.push(cur); cur = word; } else cur = t; }
  if (cur) lines.push(cur);
  return lines;
}
function drawSpeech() {
  const s = speech; if (!s) return;
  const c = mctx, hx = (OX + s.w.headX) * scale, hy = (OY + s.w.headTop - 1) * scale;
  const fs = clamp(Math.round(scale * 3.2), 14, 26);
  c.save(); c.setTransform(1, 0, 0, 1, 0, 0);
  c.font = `600 ${fs}px "Segoe UI", system-ui, -apple-system, sans-serif`; c.textBaseline = 'top';
  const lines = wrapText(c, s.text, fs * 12), lh = Math.round(fs * 1.25), padX = Math.round(fs * 0.7), padY = Math.round(fs * 0.45);
  const tw = Math.ceil(Math.max(...lines.map(l => c.measureText(l).width)));
  const bw = tw + padX * 2, bh = lines.length * lh + padY * 2, tail = Math.round(fs * 0.6);
  const bx = Math.round(clamp(hx - bw / 2, 6, cv.width - bw - 6)), by = Math.round(Math.max(6, hy - tail - bh));
  const a = Math.min(1, s.t / 0.25, (s.life - s.t) / 0.5), pop = s.t < 0.25 ? 0.85 + 0.15 * (s.t / 0.25) : 1;
  c.globalAlpha = clamp(a, 0, 1);
  c.translate(hx, hy); c.scale(pop, pop); c.translate(-hx, -hy);
  const ol = Math.max(2, Math.round(scale / 2.5)), st = Math.max(2, Math.round(scale / 1.6));
  const tx = Math.round(clamp(hx, bx + st + tail, bx + bw - st - tail));
  const body = (grow, col) => {   // pixel-style box with notched corners + a stepped tail down to the speaker
    c.fillStyle = col;
    c.fillRect(bx - grow + st, by - grow, bw + grow * 2 - st * 2, bh + grow * 2);
    c.fillRect(bx - grow, by - grow + st, bw + grow * 2, bh + grow * 2 - st * 2);
    c.fillRect(tx - tail / 2 - grow, by + bh, tail + grow * 2, Math.round(tail * 0.5) + grow);
    c.fillRect(tx - tail / 4 - grow, by + bh + Math.round(tail * 0.5), tail / 2 + grow * 2, Math.round(tail * 0.5) + grow);
  };
  body(ol, '#0b1020'); body(0, '#fffdf5');
  c.fillStyle = 'rgba(0,0,0,0.08)'; c.fillRect(bx + st, by + bh - ol, bw - st * 2, ol);
  c.fillStyle = '#0f172a';
  lines.forEach((l, i) => c.fillText(l, bx + padX, by + padY + i * lh + Math.round(fs * 0.05)));
  c.restore();
}

// ---------------------------------------------------------------- frame
const cv = document.getElementById('c'), mctx = cv.getContext('2d');
let view = null, vctx = null, scale = 1, vig = null;
const NEED_W = GX * C8 + 30, NEED_H = GY * C8 + 46;
function resize() {
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(innerWidth * dpr); cv.height = Math.round(innerHeight * dpr);
  const fit = Math.min(cv.width / NEED_W, cv.height / NEED_H);
  scale = params.has('scale') ? parseFloat(params.get('scale')) : fit < 1 ? fit : (Math.floor(fit) / fit >= 0.85 ? Math.floor(fit) : fit);
  VW = Math.ceil(cv.width / scale); VH = Math.ceil(cv.height / scale);
  OX = Math.floor((VW - GX * C8) / 2); OY = Math.floor((VH - GY * C8) / 2) + 10;
  view = canvas(VW, VH); vctx = view.getContext('2d');
  lc.c = canvas(VW, VH); lc.x = lc.c.getContext('2d');
  exteriorDirty = true;
  const cx = cv.width / 2, cy = cv.height / 2;
  vig = mctx.createRadialGradient(cx, cy, Math.min(cv.width, cv.height) * 0.35, cx, cy, Math.max(cv.width, cv.height) * 0.7);
  vig.addColorStop(0, 'rgba(10,8,30,0)'); vig.addColorStop(1, 'rgba(10,8,30,0.35)');
}
let STATIC = [];
function buildDrawables() {
  STATIC = [];
  for (const t of TABLES) for (let r = t.y0; r <= t.y1; r++) STATIC.push({ key: (r + 1) * C8 - 0.3, draw: () => drawTableRow(t, r) });
  for (const s of SEATS) {
    const ky = s.face === 'down' && s.kind === 'desk' ? s.y + 2 : s.face === 'up' ? s.y : s.face === 'down' ? s.y + 2 : s.y + 1;
    STATIC.push({ key: (s.extraMon ? ky + 1 : ky) * C8 - 0.1, draw: () => drawSeatKit(s) });   // the second (lower) monitor reaches into the next desk row
    STATIC.push({ key: (s.y + 1) * C8 + (s.face === 'up' ? 0.6 : 0.4), draw: () => drawChair(s) });
  }
  // tall-but-thin props people stand beside (island, sink counter) sort by their TOP row, so people next to them draw in front
  const BESIDE = ['island', 'counterV'];
  for (const p of PROPS) STATIC.push({ key: (BESIDE.includes(p[0]) ? p[2] + 1 : p[2] + p[4]) * C8 - 0.3, draw: () => drawProp(p) });
  STATIC.push({ key: 9 * C8 - 0.2, draw: drawWall });
}
function render() {
  lights = [];
  if (exteriorDirty) buildExterior();
  g = vctx; g.setTransform(1, 0, 0, 1, 0, 0); g.imageSmoothingEnabled = false;
  g.drawImage(ext, 0, 0);
  const alley = Math.max(0, OY - 22);
  if ((weather === 'cloud' || weather === 'rain') && alley > 0) {   // cloud shadows drifting over the alley
    g.save(); g.beginPath(); g.rect(0, 0, VW, alley - 1); g.clip();
    g.fillStyle = 'rgba(20,24,50,0.10)';
    for (const s of shadows) { const x = s.x * (VW + 160) - 80, y = s.y * alley; g.beginPath(); g.ellipse(x, y, s.r * 1.6, s.r * 0.7, 0, 0, Math.PI * 2); g.fill(); }
    g.restore();
  }
  g.translate(OX, OY);
  g.drawImage(bg, -BGX, -BGY);
  drawWindows();
  g.drawImage(wallFG, -BGX, -BGY);
  drawClockHands();
  for (const d of ROOM_DOORS) { const busy = d.kind === 'wc' && SPOTS.wc.spots.some(s => s.door === d.x && s.using && s.using.hidden); P(d.x * C8 + 6, 21 * C8 + 4, busy ? '#d9453b' : '#22b573'); }
  const list = STATIC.slice();
  for (const w of workers) if (w.present) list.push({ key: w.py + C8 + 0.5, draw: () => drawPerson(w) });
  list.push({ key: roomba.py + 4, draw: drawRoomba });
  for (const d of dogs) if (d.present) list.push({ key: d.py + C8 + 0.45, draw: () => drawDog(d) });
  if (courier.present) list.push({ key: courier.py + C8 + 0.5, draw: () => drawPerson(courier) });
  list.sort((a, b) => a.key - b.key);
  for (const it of list) it.draw();
  // weather over the outdoor alley only (it falls a little past the roof edge onto it)
  g.setTransform(1, 0, 0, 1, 0, 0);
  if (alley > 2) {
    const n = Math.ceil(drops.length * Math.min(1, alley / 60));
    if (weather === 'rain') {
      g.fillStyle = 'rgba(200,215,240,0.6)';
      for (let k = 0; k < n; k++) { const d = drops[k], x = d.x * VW, y = d.y * (alley + 3) - 3; if (outdoors(y + 3)) g.fillRect(x | 0, y | 0, 1, 3); }
      g.fillStyle = 'rgba(220,230,250,0.55)';
      for (let k = 0; k < 10; k++) { const x = hash(k, Math.floor(TIME * 3)) * VW, y = hash(k + 50, Math.floor(TIME * 3)) * (alley - 2); g.fillRect(x - 1, y, 3, 1); }
    } else if (weather === 'snow') {
      g.fillStyle = '#ffffff';
      for (let k = 0; k < Math.min(n, flakes.length); k++) { const f = flakes[k], x = (f.x * VW + Math.sin(TIME + f.p) * 3 + VW) % VW, y = f.y * alley; if (outdoors(y + f.s)) g.fillRect(x | 0, y | 0, f.s, f.s); }
    }
  }
  // alley lamps
  const night = 1 - daylight(world.hour);
  g.translate(OX, OY);
  if (night > 0.2) for (const [x, y] of lampPositions()) lights.push({ x: x - OX, y: y - OY, r: 30, a: 0.75, c: '#ffd890' });
  lighting();
  g.setTransform(1, 0, 0, 1, 0, 0);
  // to the screen, then the lo-fi grade
  mctx.imageSmoothingEnabled = false;
  mctx.drawImage(view, 0, 0, VW * scale, VH * scale);
  if (LOFI) {
    mctx.globalCompositeOperation = 'soft-light'; mctx.fillStyle = 'rgba(255,176,110,0.20)'; mctx.fillRect(0, 0, cv.width, cv.height);
    mctx.globalCompositeOperation = 'source-over'; mctx.fillStyle = vig; mctx.fillRect(0, 0, cv.width, cv.height);
  }
  drawSpeech();
}
function updateAmbient(dt) {
  for (const c of clouds) { c.x += c.v * dt; if (c.x > GX * C8 + 4) { c.x = 30 - c.w - rnd(0, 30); c.y = rnd(-17, -11); } }
  for (const s of shadows) { s.x += s.v * dt / (VW + 160); if (s.x > 1) { s.x = 0; s.y = rand(); } }
  for (const d of drops) { d.y += d.v * dt * 1.6; d.x -= d.v * dt * 0.25; if (d.y > 1) { d.y -= 1; d.x = rand(); } if (d.x < 0) d.x += 1; }
  for (const f of flakes) { f.y += f.v * dt * 0.12; if (f.y > 1) { f.y -= 1; f.x = rand(); } }
  for (const s of deskSeats) {
    const o = s.owner;
    if (o && o.present && atDesk(o) && o.pose === 'type' && typingNow(o) && chance(dt * 4)) { s.lines.shift(); s.lines.push(irnd(0, 4)); }
  }
  // background chatter: meetings, island, lunch table
  const talk = (group, icons, p) => { if (group.length > 1 && chance(dt * p)) { const w = pick(group); if (!w.bubble) say(w, weighted(icons), 1.6); } };
  if (meeting) talk(meeting.members.filter(m => m.sitAt && m.sitAt.kind === 'meet'), MEET_ICONS, 0.6);  talk(SPOTS.island.spots.map(s => s.using).filter(Boolean), CHAT_ICONS, 0.4);
  talk(LUNCH_SEATS.map(s => s.occ).filter(Boolean), CHAT_ICONS.concat([['food', 2]]), 0.35);
  if (meeting && TIME > meeting.end + 90) meeting = null;
  GLASS_DOORS.forEach(([a, b], i) => {   // sliding doors open when someone (or a dog) is close
    const near = workers.concat(dogs).some(e => e.present && !e.hidden && e.px >= a * C8 - 8 && e.px <= b * C8 + 8 && e.py >= 6 * C8 && e.py <= 10 * C8);
    doorOpen[i] += ((near ? 1 : 0) - doorOpen[i]) * Math.min(1, dt * 6);
  });
  if (world.hour < 11) for (const w of workers) w.lunchDone = false;
}
function step(dt) {
  DT = dt; TIME += dt;
  world.hour = hourNow();
  for (const c of cos) c.tick();
  for (const w of workers) if (w.bubble && (w.bubble.t -= dt) <= 0) w.bubble = null;
  for (const d of dogs) {
    if (d.bubble && (d.bubble.t -= dt) <= 0) d.bubble = null;
  }
  updateAmbient(dt);
  updateSpeech(dt);
}

// ---------------------------------------------------------------- boot
buildSprites();
buildLayers();
buildDrawables();
for (const w of workers) if (wantPresent(w)) { w.present = true; sit(w, w.home); w.greeted = rosterKey; }   // already at work when the page opens (and already said good morning)
const cos = [...workers.map(w => new Co(() => life(w))), new Co(roombaLife), new Co(() => dogLife(dogs[0], dogs[1])), new Co(() => dogLife(dogs[1], dogs[0])), new Co(courierLife)];
if (params.get('dogs') === '1') dogs.forEach(d => { d.follow = true; });   // preview: both poodles come in right away
resize();
addEventListener('resize', resize);
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'n') forcedHour = 22;
  else if (k === 'd') forcedHour = 10.5;
  else if (k === 'c') forcedHour = null;
  else if (k === 'b') { speech = null; sayRandom(); }
  else if (k === 'w') { weather = WEATHERS[(WEATHERS.indexOf(weather) + 1) % 4]; exteriorDirty = true; }
  else if (k === 'f') { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {}); }
});
keepFresh_(fetchFeed, 15 * 60 * 1000);   // speech changes every 6 h, the weather every 15 min
setInterval(() => { MONTH = zoneNow().month || MONTH; }, 3600 * 1000);
setInterval(pickRoster, 60 * 1000);   // new day: a new set of people comes in
let last = performance.now(), acc = 0;
const STEP = 1 / FPS;
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000; last = now;
  if (document.hidden) return;
  if (dt > 0.25) dt = 0.25;
  acc += dt;
  if (acc < STEP) return;
  const s = Math.min(acc, 0.12); acc = 0;
  step(s);
  render();
}
requestAnimationFrame(frame);
document.addEventListener('visibilitychange', () => { last = performance.now(); acc = 0; });
</script>
