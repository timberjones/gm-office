<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GM Office Player</title>
<style>
  :root {
    --bg: #f4ecdd; --card: #fffaf0; --ink: #33251f; --muted: #7a6656; --line: #e0d2bc;
    --accent: #d6a24a; --accent-ink: #33251f; --live: #22b573; --warn: #e8a020; --floor: #d7a873; --floor2: #c9965f;
    --pad: #efe3cf; --pad-press: #d6a24a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1e1714; --card: #2a211c; --ink: #f3e9da; --muted: #b5a291; --line: #3d3029;
      --accent: #e0b25a; --accent-ink: #1e1714; --pad: #3a2e27; --pad-press: #e0b25a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1e1714; --card: #2a211c; --ink: #f3e9da; --muted: #b5a291; --line: #3d3029;
    --accent: #e0b25a; --accent-ink: #1e1714; --pad: #3a2e27; --pad-press: #e0b25a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.4 "Segoe UI", system-ui, -apple-system, sans-serif; }
  body { min-height: 100vh; padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  h2 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 8px; }
  button { font: inherit; color: inherit; }
  .hidden { display: none !important; }

  /* ---- pick who you are */
  #pick { max-width: 420px; margin: 8vh auto 0; }
  #pick p { color: var(--muted); margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  #pick form { display: flex; gap: 8px; }
  #pick input { flex: 1; min-width: 0; font: inherit; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  .btn { border: 0; border-radius: 8px; padding: 10px 16px; background: var(--accent); color: var(--accent-ink); font-weight: 600; cursor: pointer; }
  .btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--ink); font-weight: 500; }
  .or { text-align: center; color: var(--muted); margin: 14px 0; font-size: 0.9rem; }
  #newBtn { width: 100%; }
  #again { margin-top: 14px; font-size: 0.9rem; color: var(--muted); }
  #again button { background: none; border: 0; padding: 0; color: var(--ink); text-decoration: underline; cursor: pointer; }
  #pickErr { color: #d9453b; font-size: 0.9rem; margin-top: 8px; min-height: 1.2em; }

  /* ---- play: [avatar | settings] on one row, the controls under them */
  #play { max-width: 720px; margin: 0 auto; }
  .top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .who { font-weight: 700; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 0.8rem; padding: 2px 9px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
  .chip.live .dot { background: var(--live); }
  .top .spacer { flex: 1; }
  .top .btn { padding: 5px 10px; font-size: 0.85rem; }
  .row1 { display: flex; gap: 12px; align-items: flex-start; }
  .stage { position: relative; flex: none; width: clamp(96px, 28vw, 190px); border-radius: 10px; overflow: hidden; border: 1px solid var(--line);
    background: repeating-linear-gradient(0deg, var(--floor) 0 10px, var(--floor2) 10px 12px); }
  #avatar { display: block; width: 100%; aspect-ratio: 3 / 4; image-rendering: pixelated; }
  .where { position: absolute; left: 0; right: 0; bottom: 0; font-size: 0.7rem; text-align: center; background: rgba(30, 20, 15, 0.72); color: #fff6e6; padding: 2px 4px; }
  .hint { font-size: 0.78rem; color: var(--muted); text-align: center; margin-top: 4px; }

  /* dress up: label | options, one line each */
  .looks { flex: 1; min-width: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 5px 8px; align-items: center; }
  .looks .lbl { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); white-space: nowrap; }
  .opts { display: flex; flex-wrap: wrap; gap: 4px; }
  .sw { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--line); cursor: pointer; padding: 0; }
  .sw.sel { border-color: var(--ink); box-shadow: 0 0 0 2px var(--card) inset; }
  .sw.none { background: repeating-linear-gradient(45deg, var(--card) 0 4px, var(--line) 4px 6px); }
  .seg { border: 1px solid var(--line); background: var(--card); border-radius: 6px; padding: 1px 7px; cursor: pointer; font-size: 0.78rem; }
  .seg.sel { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  .seg:disabled { opacity: 0.4; cursor: default; }
  .saved { grid-column: 1 / -1; font-size: 0.72rem; color: var(--muted); min-height: 1.1em; }
  .group { display: contents; }
  .tabs { display: none; }
  @media (min-width: 600px) { .sw { width: 26px; height: 26px; } .seg { padding: 3px 10px; font-size: 0.85rem; } .looks { gap: 7px 12px; } }
  /* phones: thumb-sized buttons; the settings come in 4 tabs (Body / Hair / Face / Clothes) beside the avatar */
  @media (max-width: 599px) {
    .looks { display: block; min-height: 250px; }   /* the tallest tab (Body), so the d-pad doesn't jump when you switch */
    .tabs { display: flex; gap: 4px; margin-bottom: 8px; }
    .tab { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 8px 2px; font-size: 0.8rem; font-weight: 600; cursor: pointer; }
    .tab.sel { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    .group { display: none; }
    .group.on { display: block; }
    .looks .lbl { margin: 6px 0 4px; }
    .opts { gap: 6px; }
    .sw { width: 38px; height: 38px; border-radius: 9px; }
    .seg { min-height: 38px; padding: 6px 12px; font-size: 0.9rem; border-radius: 9px; }
    .saved { margin-top: 6px; }
  }

  /* d-pad */
  .pad { display: grid; grid-template-columns: repeat(3, 58px); grid-template-rows: repeat(3, 58px); gap: 5px; justify-content: center; margin: 12px auto 0;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  .pad button { border: 1px solid var(--line); border-radius: 12px; background: var(--pad); font-size: 1.4rem; cursor: pointer; touch-action: none; display: flex; align-items: center; justify-content: center; }
  .pad button.on { background: var(--pad-press); color: var(--accent-ink); }
  .pad .sit, .pad .talk, .pad .act { font-size: 0.8rem; font-weight: 600; border-radius: 50%; }
  @media (max-width: 599px) {   /* phones: a big d-pad for thumbs */
    .pad { grid-template-columns: repeat(3, 76px); grid-template-rows: repeat(3, 76px); gap: 8px; margin-top: 16px; }
    .pad button { font-size: 1.8rem; border-radius: 16px; }
    .pad .sit, .pad .talk, .pad .act { font-size: 0.95rem; }
  }
  /* secret washroom trivia */
  .trivia { position: fixed; inset: 0; background: rgba(20, 14, 10, 0.55); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
  .tcard { width: 100%; max-width: 460px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25); }
  .thead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; font-weight: 700; }
  .thead .btn { padding: 4px 10px; }
  .tcard p { margin: 0 0 10px; }
  .tmuted { color: var(--muted); font-size: 0.9rem; }
  .tbar { height: 8px; border-radius: 4px; background: var(--pad); overflow: hidden; margin-bottom: 6px; }
  .tbar i { display: block; height: 100%; width: 100%; background: var(--accent); }
  .tmeta { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--muted); margin-bottom: 10px; }
  .tq { font-weight: 600; min-height: 3em; }
  .timg { display: block; width: 100%; height: 200px; object-fit: contain; background: var(--pad); border-radius: 10px; }
  .tcredit { font-size: 0.7rem; color: var(--muted); margin: 2px 0 8px !important; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  @media (max-height: 640px) { .timg { height: 150px; } }
  .topts { display: grid; gap: 8px; }
  .topts button { text-align: left; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 10px; padding: 12px; font: inherit; cursor: pointer; min-height: 48px; }
  .topts button.right { background: #22b573; border-color: #22b573; color: #fff; }
  .topts button.wrong { background: #d9453b; border-color: #d9453b; color: #fff; }
  .tbig { font-size: 3rem; font-weight: 800; text-align: center; margin: 4px 0 0 !important; }
  .trow { display: flex; gap: 8px; }
  .trow .btn { flex: 1; }
  .pad .up { grid-area: 1 / 2; } .pad .left { grid-area: 2 / 1; } .pad .sit { grid-area: 2 / 2; } .pad .right { grid-area: 2 / 3; } .pad .down { grid-area: 3 / 2; } .pad .talk { grid-area: 3 / 3; } .pad .act { grid-area: 3 / 1; }
</style>
</head>
<body>

<main id="pick" class="hidden">
  <h1>GM Office</h1>
  <p>Walk your character around the office TV and dress them up.</p>
  <div class="card">
    <h2>Your user id</h2>
    <form id="idForm" autocomplete="off">
      <input id="idInput" inputmode="numeric" pattern="[0-9]*" maxlength="8" placeholder="e.g. 1111" aria-label="User id">
      <button class="btn" type="submit">Go</button>
    </form>
    <div id="pickErr"></div>
    <div class="or">or</div>
    <button id="newBtn" class="btn ghost" type="button">I'm new here</button>
    <div id="again" class="hidden">Last time: <button id="againBtn" type="button"></button></div>
  </div>
</main>

<main id="play" class="hidden">
  <div class="top">
    <span class="who" id="who"></span>
    <span class="chip" id="status"><span class="dot"></span><span id="statusText">Connecting…</span></span>
    <span class="spacer"></span>
    <button class="btn ghost" id="switchBtn" type="button">Switch person</button>
  </div>
  <div class="row1">
    <div class="stage">
      <canvas id="avatar" width="150" height="200"></canvas>
      <span class="where" id="where"></span>
    </div>
    <section class="looks" id="looks"></section>
  </div>
  <div class="pad" id="pad">
    <button class="up" data-dir="up" aria-label="Up">▲</button>
    <button class="left" data-dir="left" aria-label="Left">◀</button>
    <button class="sit" id="sitBtn" aria-label="Sit or stand">Sit</button>
    <button class="talk" id="talkBtn" aria-label="Say something">Talk</button>
    <button class="act hidden" id="actBtn"></button>
    <button class="right" data-dir="right" aria-label="Right">▶</button>
    <button class="down" data-dir="down" aria-label="Down">▼</button>
  </div>
  <div class="trivia hidden" id="trivia" role="dialog" aria-label="Plant trivia">
    <div class="tcard">
      <div class="thead"><span>Plant trivia</span><button class="btn ghost" id="tClose" type="button" aria-label="Close">&#x2715;</button></div>
      <div id="tBody"></div>
    </div>
  </div>
  <div class="hint" id="hint">Tap or hold the arrows · keyboard: arrows / WASD, Space to sit</div>
</main>

<script type="module">
// GM Office player page. Pick a user id (or start as someone new), then walk your character around the office TV
// with the arrow keys or the on-screen d-pad, and dress them up. Everything goes through the GM Office relay
// (relay/, a Cloudflare Worker) to every open gm-office.html. Close this page (or leave it in the background for a
// minute) and your character goes back to its routine, or walks out if it isn't in today.
// The people sprites and the office layout come straight from gm-office.html (the code between its @shared
// markers), so this page always draws and walks exactly like the office does.
const RELAY_PARAM = new URLSearchParams(location.search).get('relay');   // ?relay= for testing against a local relay (kept in the address)
const RELAY_URL = RELAY_PARAM || 'wss://gm-office-relay.tj-c25.workers.dev/ws';
const SID = Math.random().toString(36).slice(2, 12);   // this tab: if it reconnects, the relay knows it's still us (not a second person)
const keepQS = () => RELAY_PARAM ? 'relay=' + encodeURIComponent(RELAY_PARAM) : '';
const MANUAL_WALK = 48;   // px per second, same as a driven character on the TV
const DIRV = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
const $ = id => document.getElementById(id);
const store = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };

// ---- the office's own people + layout code
async function loadShared() {
  const html = await (await fetch('gm-office.html', { cache: 'no-cache' })).text();
  const parts = [...html.matchAll(/\/\/ @shared-begin[^\n]*\n([\s\S]*?)\/\/ @shared-end/g)].map(m => m[1]);
  if (parts.length < 4) throw new Error('shared code not found in gm-office.html');
  const el = document.createElement('script');
  el.textContent = parts.join('\n');
  document.head.appendChild(el);   // classic script: its consts (SEATS, bfs, buildFrames, KNOWN ...) become globals
}

// ---- who you are
function knownSeat(uid) {   // [seat, default look] for an id the office knows, or null
  for (const [code, list] of Object.entries(KNOWN)) {
    const p = list.find(p => String(p.uid) === String(uid));
    if (!p) continue;
    const seat = deskSeats.find(s => s.code === code);
    if (!seat) return [null, p.look || null];   // known but no desk of their own (the floater): comes in through the door
    return [seat, p.look || ROLES[seat.role].look];
  }
  return null;
}
const SEX_STYLES = { m: ['short', 'spiky'], f: ['long', 'bun'] };
function startLook(uid) {
  if (uid === DOG_ID) return Object.assign({}, DOG_LOOK);   // easter egg: 101 Dalmatians
  const k = knownSeat(uid), base = k && k[1] ? k[1] : randomLook();
  const l = Object.assign({ hat: null, beard: false, goatee: false, glasses: false, build: null }, base);
  if (!l.sex) l.sex = SEX_STYLES.f.includes(l.style) ? 'f' : 'm';
  return l;
}
let me = null;   // { uid, home, look, frames, tx, ty, px, py, q, seat, dir, walkT, lookTouched }
const NEW_ID = '1111';   // the example id: typing it means "make me someone new" (no staff member has it)
const newId = () => '9' + String(Math.floor(Math.random() * 1e6)).padStart(6, '0');
function startAs(uid) {
  uid = String(uid).replace(/\D/g, '').slice(0, 8);
  if (!uid) { $('pickErr').textContent = 'Type a user id (numbers only).'; return; }
  if (uid === NEW_ID) uid = newId();
  store.set('gmOfficeUid', uid);
  history.replaceState(null, '', '?id=' + uid + (keepQS() ? '&' + keepQS() : ''));
  const k = knownSeat(uid), home = k ? k[0] : null, look = startLook(uid);
  me = { uid, home, look, frames: framesFor_(look), dog: uid === DOG_ID, q: [], seat: null, dir: 'right', walkT: 0, lookTouched: false, lookFromRelay: false };
  // Everyone starts at the entrance: if the office says your character is already in (a 'where' from the relay),
  // you jump to wherever it is; if not, it just walks in the door and it's yours right away (no walk to your desk first).
  Object.assign(me, { tx: 0, ty: 25, dir: 'right' });
  me.px = me.tx * C8; me.py = me.ty * C8;
  $('who').textContent = me.dog ? "Woof! You're the office dog" : (k ? 'User ' : 'New person ') + uid;
  $('sitBtn').setAttribute('aria-label', me.dog ? 'Bark' : 'Sit or stand');
  $('talkBtn').classList.toggle('hidden', !!me.dog);   // the dog has its Woof button instead
  const act = myAction();   // an extra button only for ids with an action (ACTIONS in gm-office.html)
  $('actBtn').classList.toggle('hidden', !act);
  if (act) { $('actBtn').textContent = act.label; $('actBtn').setAttribute('aria-label', act.label); }
  $('hint').textContent = me.dog ? 'Tap or hold the arrows · keyboard: arrows / WASD, Space to woof' : 'Tap or hold the arrows · keyboard: arrows / WASD, Space to sit, T to talk' + (act ? ', ' + act.key.toUpperCase() + ' to ' + (act.hint || act.label.toLowerCase()) : '');
  $('pick').classList.add('hidden'); $('play').classList.remove('hidden');
  buildLooksUI(); updateWhere();
  relay.stop = false; relayConnect();
}
function showPick() {
  relayHangUp();
  me = null; held = [];
  history.replaceState(null, '', location.pathname + (keepQS() ? '?' + keepQS() : ''));
  $('play').classList.add('hidden'); $('pick').classList.remove('hidden');
  const last = store.get('gmOfficeUid');
  $('again').classList.toggle('hidden', !last);
  if (last) $('againBtn').textContent = 'continue as ' + last;
  $('idInput').value = ''; $('pickErr').textContent = '';
}

// ---- walking (the same grid and rules as the office)
const walkable = (x, y) => x >= 0 && y >= 0 && x < GX && y < GY && !blocked[idx(x, y)] && !isSeat[idx(x, y)];
const seatAt = (x, y) => SEATS.find(s => s.x === x && s.y === y);
let held = [];   // directions held (keys or d-pad), last pressed last
const heldDir = () => held[held.length - 1] || null;
function press(dir) { if (!me) return; held = held.filter(d => d !== dir).concat(dir); queueStep(dir); }
function unpress(dir) { held = held.filter(d => d !== dir); }
function queueStep(dir) {
  if (me.q.length >= 2) return;   // taps can queue one step ahead, no more
  const [ax, ay] = me.q.length ? me.q[me.q.length - 1] : [me.tx, me.ty], nx = ax + DIRV[dir][0], ny = ay + DIRV[dir][1];
  if (dir === 'down' && !me.q.length && me.tx === WC_DOOR[0] && me.ty === WC_DOOR[1]) {   // into the washroom (it's below the door): secret trivia
    me.dir = 'down'; me.seat = null; send({ t: 'step', x: me.tx, y: me.ty, dir: 'down', sit: false });
    send({ t: 'hide', on: true });   // gone from the office while they play
    openTrivia(); return;
  }
  if (walkable(nx, ny)) { me.dir = dir; me.q.push([nx, ny]); send({ t: 'step', x: nx, y: ny, dir, sit: false }); }
  else if (me.dir !== dir || me.seat) {   // bumped into something: turn to face it (and get up, if sitting)
    me.dir = dir;
    if (!me.q.length) { me.seat = null; send({ t: 'step', x: me.tx, y: me.ty, dir, sit: false }); }
  }
}
function talk() {   // the office picks one of your lines (yours, else your group's) and your character says it
  if (!me || me.dog) return;
  if (send({ t: 'talk' })) flashWhere('Talking...');
}
// your id's action (ACTIONS, shared from gm-office.html): the leading screen plays it for everyone
const myAction = () => me && !me.dog ? (ACTIONS[String(me.uid).replace(/c\d+$/, '')] || [])[0] || null : null;
let actAt = 0;
function doAction() {
  const act = myAction();
  if (!act || Date.now() - actAt < 2500) return;
  actAt = Date.now();
  if (send({ t: 'act', a: act.id })) flashWhere(act.label + '...');
}
function sitOrStand() {
  if (me && me.dog) { send({ t: 'bark' }); flashWhere('Woof!'); return; }   // dogs don't sit in chairs: they bark
  if (!me || me.q.length) return;
  if (me.seat) { me.seat = null; send({ t: 'step', x: me.tx, y: me.ty, dir: me.dir, sit: false }); updateWhere(); return; }
  for (const d of [me.dir, ...Object.keys(DIRV).filter(d => d !== me.dir)]) {   // the seat you're facing first
    const s = seatAt(me.tx + DIRV[d][0], me.ty + DIRV[d][1]);
    if (!s) continue;
    me.q.push([s.x, s.y, s]); send({ t: 'step', x: s.x, y: s.y, dir: s.face, sit: true });
    return;
  }
  flashWhere('No seat next to you');
}
function walk(dt) {
  if (!me.q.length && heldDir()) queueStep(heldDir());
  if (!me.q.length) return;
  const [nx, ny, seat] = me.q[0], gx = nx * C8, gy = ny * C8, dx = gx - me.px, dy = gy - me.py, st = MANUAL_WALK * dt;
  me.seat = null; me.walkT += dt;
  if (Math.abs(dx) > 0.01 || Math.abs(dy) > 0.01) me.dir = Math.abs(dx) >= Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
  if (Math.abs(dx) + Math.abs(dy) <= st) {
    me.px = gx; me.py = gy; me.tx = nx; me.ty = ny; me.q.shift();
    if (seat && !me.q.length) { me.seat = seat; me.dir = seat.face; }
    updateWhere();
  } else {
    me.px += Math.sign(dx) * Math.min(st, Math.abs(dx));
    me.py += Math.sign(dy) * Math.min(st, Math.abs(dy));
  }
}

// ---- where am I (a word under the avatar)
function placeName(x, y, seat) {
  if (seat) {
    if (me.home && seat === me.home) return 'At your desk';
    return { desk: 'At a desk', meet: 'In the meeting room', lunch: 'At the lunch table', bar: 'At the bar table' }[seat.kind] || 'Sitting';
  }
  if (x === WC_DOOR[0] && y === WC_DOOR[1]) return 'At the washroom door';
  if (x <= 5) return 'At the entrance';
  if (y <= 7) return x >= 33 ? 'In the meeting room' : 'In an office';
  if (y >= 21 && x >= 27 && x <= 34) return 'In the kitchen';
  if (y >= 19 && x >= 35 && x <= 42) return 'By the lunch table';
  if (y >= 19 && x < 16) return 'Near the entrance';
  return 'Walking around the office';
}
let flashT = 0;
function updateWhere() { if (me && !T.open && performance.now() > flashT) $('where').textContent = placeName(me.tx, me.ty, me.seat); }
function flashWhere(t) { $('where').textContent = t; flashT = performance.now() + 1500; setTimeout(updateWhere, 1600); }
// ---- your character, big
function renderAvatar(t) {
  const c = $('avatar'), dpr = window.devicePixelRatio || 1, W = Math.round(c.clientWidth * dpr), H = Math.round(c.clientHeight * dpr);
  if (c.width !== W || c.height !== H) { c.width = W; c.height = H; }

  requestAnimationFrame(frame);
} catch (e) {
  document.body.innerHTML = '<p style="padding:16px">Couldn\'t load the office. Refresh to try again.</p>';
  console.error(e);
}
</script>
</body>
</html>
